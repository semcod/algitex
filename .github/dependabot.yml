version: 2
updates:
- package-ecosystem: uv
  directory: /
  schedule:
    interval: cron
    cronjob: 28 4 * * *
    timezone: Europe/Warsaw
  open-pull-requests-limit: 1
  versioning-strategy: increase-if-necessary
  allow:
  - dependency-name: clickmd
    dependency-type: all
  - dependency-name: code2llm
    dependency-type: all
  - dependency-name: costs
    dependency-type: all
  - dependency-name: goal
    dependency-type: all
  - dependency-name: llx
    dependency-type: all
  - dependency-name: planfile
    dependency-type: all
  - dependency-name: proxym
    dependency-type: all
  - dependency-name: vallm
    dependency-type: all
  groups:
    internal-packages:
      patterns:
      - clickmd
      - code2llm
      - costs
      - goal
      - llx
      - planfile
      - proxym
      - vallm
  commit-message:
    prefix: "chore(deps)"
